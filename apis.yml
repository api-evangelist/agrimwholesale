aid: agrimwholesale
name: Agrim Wholesale
description: 'Agrim Wholesale Private Limited (branded AGRIM) is a Gurugram, India based
  business-to-business e-commerce marketplace for agricultural inputs, connecting agri-input
  manufacturers and wholesale suppliers with small rural retailers. Founded in 2020 by Avi
  Jain and Mukul Garg, the company lists more than 30,000 seed, crop-protection, fertiliser
  and farm-equipment products from over 1,200 manufacturers and fulfils orders across a
  pan-India network. The platform is delivered to retailers and sellers as Android
  applications and a marketing website at agrim.app; as of this profile the company
  publishes no public developer program, API reference, or machine-readable API contract.'
